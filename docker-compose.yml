services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  django:
    build: ./backend/django_api
    command: python manage.py runserver 0.0.0.0:8000
    env_file: .env
    volumes:
      - ./backend/django_api:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  laravel:
    build: ./backend/laravel_api
    command: php artisan serve --host=0.0.0.0 --port=8001
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./backend/laravel_api:/app
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - django
      - laravel

volumes:
  pgdata: